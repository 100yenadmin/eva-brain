name: Regenerate llms bundle once

on:
  push:
    branches: [fix/retrieval-reflex-policy-skill-v8]

permissions:
  contents: write

jobs:
  regenerate:
    if: contains(github.event.head_commit.message, '[regen-llms]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: fix/retrieval-reflex-policy-skill-v8
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.3.13
      - run: bun install
      - run: bun run build:llms
      - name: Commit generated bundle and remove this one-shot workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr-regenerate-llms-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add llms.txt llms-full.txt .github/workflows/pr-regenerate-llms-once.yml
          if git diff --cached --quiet; then
            echo "No llms or workflow cleanup changes to commit"
            exit 0
          fi
          git commit -m "Regenerate llms bundle"
          git push origin HEAD:fix/retrieval-reflex-policy-skill-v8
