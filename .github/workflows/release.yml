name: Release

on:
  push:
    tags: ['eva-v*']
    branches: ['release/eva-v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Eva release tag to publish, for example eva-v0.40.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-tag:
    if: startsWith(github.ref, 'refs/heads/release/eva-v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Create matching Eva release tag
        run: |
          set -euo pipefail
          release_tag="${GITHUB_REF_NAME#release/}"
          case "$release_tag" in
            eva-v*) ;;
            *) echo "Release branches must use release/eva-v*, got: $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac
          expected="eva-v$(node -p "require('./package.json').version")"
          if [ "$release_tag" != "$expected" ]; then
            echo "Release tag must match package.json version: expected $expected, got $release_tag" >&2
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/tags/$release_tag" >/dev/null 2>&1; then
            echo "Tag $release_tag already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$release_tag" "$GITHUB_SHA" -m "Eva Brain ${release_tag#eva-v}"
          git push origin "refs/tags/$release_tag"

  build:
    needs: create-tag
    if: always() && (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped') && (startsWith(github.ref, 'refs/tags/eva-v') || startsWith(github.ref, 'refs/heads/release/eva-v') || github.event_name == 'workflow_dispatch')
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: gbrain-darwin-arm64
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: gbrain-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Resolve Eva release tag
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            release_tag="$INPUT_TAG_NAME"
          elif [[ "$GITHUB_REF" == refs/heads/release/eva-v* ]]; then
            release_tag="${GITHUB_REF_NAME#release/}"
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          case "$release_tag" in
            eva-v*) ;;
            *) echo "Release tags must use eva-v*, got: $release_tag" >&2; exit 1 ;;
          esac
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: latest
      - name: Validate release tag matches package version
        run: |
          set -euo pipefail
          expected="eva-v$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$expected" ]; then
            echo "Release tag must match package.json version: expected $expected, got $RELEASE_TAG" >&2
            exit 1
          fi
      - run: bun install
      - run: bun run build:openclaw
      - run: bun build --compile --target=${{ matrix.target }} --outfile bin/${{ matrix.artifact }} src/cli.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.artifact }}
          path: bin/${{ matrix.artifact }}

  release:
    needs: build
    if: always() && needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/eva-v') || startsWith(github.ref, 'refs/heads/release/eva-v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve Eva release tag
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            release_tag="$INPUT_TAG_NAME"
          elif [[ "$GITHUB_REF" == refs/heads/release/eva-v* ]]; then
            release_tag="${GITHUB_REF_NAME#release/}"
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          case "$release_tag" in
            eva-v*) ;;
            *) echo "Release tags must use eva-v*, got: $release_tag" >&2; exit 1 ;;
          esac
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artifacts
      - name: Generate checksums
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            eva-v*) ;;
            *) echo "Release tags must use eva-v*, got: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          cd artifacts
          find . -type f -name 'gbrain-*' -print0 \
            | sort -z \
            | while IFS= read -r -d '' file; do
                hash="$(sha256sum "$file" | awk '{print $1}')"
                printf '%s  %s\n' "$hash" "$(basename "$file")"
              done > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe  # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            artifacts/gbrain-darwin-arm64/gbrain-darwin-arm64
            artifacts/gbrain-linux-x64/gbrain-linux-x64
            artifacts/SHA256SUMS
          generate_release_notes: true
